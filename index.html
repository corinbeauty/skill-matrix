<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不老松中清店 - 員工工作技能表</title>
    <!-- 匯入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 匯入 Font Awesome 用於星星圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2c4a3b', // 不老松風格深綠色
                        secondary: '#d4af37', // 金色
                        background: '#f9f9f9',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f4f7f6;
            /* 強制滿版，防止不必要的整頁捲動 */
            height: 100vh;
            overflow: hidden;
        }
        
        /* 自訂捲軸支援雙向 */
        .table-container::-webkit-scrollbar {
            height: 10px; /* 稍微縮小捲軸以節省空間 */
            width: 10px;
        }
        
        /* 自訂捲軸支援雙向 */
        .table-container::-webkit-scrollbar {
            height: 12px;
            width: 12px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 8px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 8px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* 凍結左側與上方的 CSS 將改用 Tailwind utility classes 實現 */
        
        /* 星星評分樣式 */
        .star-rating {
            display: inline-flex;
            flex-direction: row;
            position: relative;
            /* 預設隱藏指標，由權限決定 */
            width: 100px; 
        }
        .star-rating.is-admin {
            cursor: pointer;
        }
        .star-rating i {
            color: #cbd5e1; /* 預設灰星 */
            margin-right: 2px;
            position: relative;
        }
        .star-rating i.active {
            color: #d4af37; /* 金星 */
        }
        .star-rating i.half-active::before {
            content: '\f089'; /* FontAwesome half star outline if we want, or just clip */
            position: absolute;
            color: #d4af37;
            overflow: hidden;
            width: 50%;
        }
        /* 自訂半星顯示方式 */
        .star-wrapper {
            position: relative;
            display: inline-block;
            width: 18px;
        }
        .star-wrapper .fa-star {
            color: #cbd5e1;
        }
        .star-wrapper .fill-star {
            position: absolute;
            left: 0;
            top: 0;
            color: #d4af37;
            overflow: hidden;
            white-space: nowrap;
        }
        .w-0 { width: 0%; }
        .w-50 { width: 50%; }
        .w-100 { width: 100%; }
        
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
        }
        .modal-overlay.active {
            display: flex;
        }
        
        /* 緊湊型星星樣式，節省高度 */
        .star-rating i {
            margin-right: 1px;
            font-size: 0.8rem;
        }
        .star-wrapper {
            width: 14px;
        }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col overflow-hidden">

    <header class="bg-primary text-white shadow-md py-2 px-4 flex justify-between items-center z-30 shrink-0">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-leaf text-secondary text-xl"></i>
            <h1 class="text-xl font-bold tracking-wider">不老松足湯 中清店</h1>
            <span class="text-xs border-l border-gray-400 pl-2 ml-2 text-gray-200">員工技能表</span>
        </div>
        
        <!-- 訪客/預設狀態 -->
        <div class="flex gap-2" id="guestToolbar">
            <button id="loginBtn" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded-md transition-colors text-xs font-medium flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-lock"></i> 管理員登入
            </button>
        </div>
        
        <!-- 管理員狀態 (預設隱藏) -->
        <div class="hidden gap-2" id="adminToolbar">
            <button id="manageColumnsBtn" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-md transition-colors text-xs font-medium flex items-center gap-1 shadow-sm border border-emerald-500">
                <i class="fa-solid fa-gear"></i> 欄位管理
            </button>
            <button id="addEmployeeBtn" class="bg-secondary hover:bg-yellow-600 text-white px-3 py-1.5 rounded-md transition-colors text-xs font-medium flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-plus"></i> 新增員工
            </button>
            <button id="saveDataBtn" class="bg-white text-primary hover:bg-gray-100 px-3 py-1.5 rounded-md transition-colors text-xs font-medium flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-cloud-arrow-up"></i> 儲存
            </button>
            <button id="logoutBtn" class="bg-red-700 hover:bg-red-600 text-white px-3 py-1.5 rounded-md transition-colors text-xs font-medium flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-right-from-bracket"></i> 登出
            </button>
        </div>
    </header>

    <main class="flex-grow p-2 md:p-3 flex flex-col overflow-hidden gap-3 min-h-0">
        
        <div class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col flex-grow border border-gray-200 min-h-0">
            <!-- 頂部工具列 -->
            <div class="p-2 border-b border-gray-200 bg-gray-50 flex justify-between items-center shrink-0">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-2 top-1/2 transform -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="搜尋員編或姓名..." class="pl-8 pr-3 py-1 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-primary focus:border-transparent text-xs w-48">
                </div>
                <div class="text-xs text-gray-500">
                    更新: <span id="lastUpdated" class="font-medium text-gray-700">尚未</span>
                </div>
            </div>

            <!-- 表格容器，滿版設計 -->
            <div class="table-container overflow-auto flex-grow relative bg-gray-50">
                <table class="w-full text-xs whitespace-nowrap border-collapse" id="employeeTable">
                    <!-- 表頭與內容將由 JS 動態生成轉置矩陣 -->
                </table>
                <!-- 空資料狀態 -->
                <div id="emptyState" class="hidden flex-col items-center justify-center py-12 text-gray-500 w-full absolute top-1/3 left-0">
                    <i class="fa-solid fa-users text-4xl mb-3 text-gray-300"></i>
                    <p>目前尚無員工資料，請點擊右上方「新增員工」</p>
                </div>
            </div>
        </div>
        
        <!-- 客訴紀錄區塊 (預設折疊，縮減高度) -->
        <div class="bg-white rounded-lg shadow-md border border-red-100 overflow-hidden shrink-0">
            <div class="bg-red-50 border-b border-red-100 p-2 flex justify-between items-center cursor-pointer" id="complaintHeader">
                <div class="flex items-center gap-2 text-red-700">
                    <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                    <h2 class="font-bold text-sm">客訴與異常紀錄</h2>
                    <span class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full" id="complaintCount">0</span>
                </div>
                <i class="fa-solid fa-chevron-down text-red-400 transition-transform duration-300" id="complaintToggleIcon"></i>
            </div>
            
            <div class="p-4 hidden" id="complaintContent">
                <form id="complaintForm" class="hidden mb-4 bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <h3 class="text-sm font-bold text-gray-700 mb-3">新增紀錄</h3>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">發生日期</label>
                            <input type="date" id="complaintDate" class="w-full border border-gray-300 rounded p-1.5 text-sm" required>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">相關員工 (可選)</label>
                            <select id="complaintEmployee" class="w-full border border-gray-300 rounded p-1.5 text-sm">
                                <option value="">無特定對象 / 整體</option>
                                <!-- 選項由 JS 載入 -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">類型</label>
                            <select id="complaintType" class="w-full border border-gray-300 rounded p-1.5 text-sm">
                                <option value="客訴">顧客投訴</option>
                                <option value="服務缺失">服務缺失</option>
                                <option value="紀律問題">紀律問題</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">處理狀態</label>
                            <select id="complaintStatus" class="w-full border border-gray-300 rounded p-1.5 text-sm">
                                <option value="pending">處理中</option>
                                <option value="resolved">已結案</option>
                            </select>
                        </div>
                        <div class="md:col-span-3">
                            <label class="block text-xs text-gray-600 mb-1">事件描述</label>
                            <input type="text" id="complaintDesc" class="w-full border border-gray-300 rounded p-1.5 text-sm" placeholder="簡述事件狀況..." required>
                        </div>
                        <div class="md:col-span-1 flex items-end">
                            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white rounded p-1.5 text-xs transition-colors">
                                <i class="fa-solid fa-plus mr-1"></i> 新增
                            </button>
                        </div>
                    </div>
                </form>

                <div class="overflow-x-auto max-h-40 overflow-y-auto">
                    <table class="w-full text-xs text-left">
                        <thead class="text-[10px] text-gray-700 bg-gray-100 uppercase sticky top-0">
                            <tr>
                                <th class="px-4 py-2">日期</th>
                                <th class="px-4 py-2">相關人員</th>
                                <th class="px-4 py-2">類型</th>
                                <th class="px-4 py-2">事件描述</th>
                                <th class="px-4 py-2">狀態</th>
                                <th class="px-4 py-2 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="complaintTableBody">
                            <!-- 客訴紀錄由 JS 產生 -->
                        </tbody>
                    </table>
                    <div id="emptyComplaintState" class="text-center py-4 text-gray-500 text-sm">
                        尚無客訴紀錄
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-gray-400 py-3 text-center text-xs">
        &copy; 2026 版權 原點數位科技 | 不老松中清店員工管理系統
    </footer>

    <!-- Modal: 新增/編輯員工 -->
    <div id="employeeModal" class="modal-overlay fixed inset-0 z-50 items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-primary text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-lg" id="modalTitle">新增員工資料</h3>
                <button id="closeModalBtn" class="text-gray-300 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-grow">
                <form id="employeeForm">
                    <input type="hidden" id="editEmpId" value="">
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">員工編號 <span class="text-red-500">*</span></label>
                            <input type="text" id="empCode" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">姓名 <span class="text-red-500">*</span></label>
                            <input type="text" id="empName" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-primary focus:border-primary">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">入職日期 <span class="text-red-500">*</span></label>
                            <input type="date" id="empJoinDate" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">職級</label>
                            <select id="empLevel" class="w-full border border-gray-300 rounded-md p-2 focus:ring-primary focus:border-primary">
                                <option value="店長">店長</option>
                                <option value="主任">主任</option>
                                <option value="領航員">領航員</option>
                                <option value="櫃台">櫃台</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">大頭貼照 (選填，請貼上圖片網址)</label>
                        <input type="url" id="empPhotoUrl" placeholder="https://..." class="w-full border border-gray-300 rounded-md p-2 focus:ring-primary focus:border-primary">
                        <p class="text-xs text-gray-500 mt-1">若留空將使用預設頭像</p>
                    </div>
                </form>
            </div>
            
            <div class="p-4 border-t border-gray-200 bg-gray-50 flex justify-end gap-3">
                <button id="cancelModalBtn" type="button" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-100 transition-colors">取消</button>
                <button id="submitEmployeeBtn" form="employeeForm" type="submit" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-emerald-800 transition-colors">儲存</button>
            </div>
        </div>
    </div>

    <!-- Modal: 權限密碼驗證 -->
    <div id="authModal" class="modal-overlay fixed inset-0 z-[60] items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-sm mx-4 overflow-hidden">
            <div class="bg-emerald-800 text-white p-3 flex justify-between items-center">
                <h3 class="font-bold text-sm"><i class="fa-solid fa-lock mr-2"></i>管理員權限驗證</h3>
                <button onclick="document.getElementById('authModal').classList.remove('active')" class="text-gray-300 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-5 text-center">
                <p class="text-sm text-gray-600 mb-4">請輸入管理員密碼以進入欄位管理模式。</p>
                <input type="password" id="adminPassword" class="w-full border border-gray-300 rounded p-2 text-center text-lg tracking-widest focus:ring-primary focus:border-primary mb-4" placeholder="輸入密碼">
                <button id="verifyPasswordBtn" class="w-full bg-primary text-white py-2 rounded hover:bg-emerald-800 transition-colors text-sm font-bold">驗證並進入</button>
            </div>
        </div>
    </div>

    <!-- Modal: 欄位(列)管理 -->
    <div id="manageColumnsModal" class="modal-overlay fixed inset-0 z-[60] items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden flex flex-col max-h-[85vh]">
            <div class="bg-emerald-800 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-table-list mr-2"></i>技能與項目欄位管理</h3>
                <button onclick="document.getElementById('manageColumnsModal').classList.remove('active')" class="text-gray-300 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="p-4 bg-gray-50 border-b border-gray-200 flex gap-2">
                <button onclick="addNewRow('rating')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-sm transition-colors shadow-sm">
                    <i class="fa-solid fa-star mr-1"></i> 新增評分項目
                </button>
                <button onclick="addNewRow('category')" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded text-sm transition-colors shadow-sm">
                    <i class="fa-solid fa-folder-open mr-1"></i> 新增分類標題
                </button>
                <span class="text-xs text-gray-500 ml-auto self-center">提示：基本資料欄位已鎖定不可刪除</span>
            </div>

            <div class="p-0 overflow-y-auto flex-grow bg-white">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-100 text-gray-700 sticky top-0 shadow-sm">
                        <tr>
                            <th class="px-4 py-2 w-24">類型</th>
                            <th class="px-4 py-2">顯示名稱 (點擊可編輯)</th>
                            <th class="px-4 py-2 w-24 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="columnsManageBody">
                        <!-- 透過 JS 動態產生 -->
                    </tbody>
                </table>
            </div>
            
            <div class="p-4 border-t border-gray-200 bg-gray-50 flex justify-end gap-3">
                <button onclick="document.getElementById('manageColumnsModal').classList.remove('active')" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-emerald-800 transition-colors shadow-sm">完成並套用</button>
            </div>
        </div>
    </div>

    <!-- 自訂訊息框 (替代 alert) -->
    <div id="messageModal" class="modal-overlay fixed inset-0 z-[60] items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full mx-4 text-center">
            <div id="messageIcon" class="text-4xl mb-3 text-primary">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 id="messageTitle" class="text-lg font-bold text-gray-800 mb-2">提示</h3>
            <p id="messageText" class="text-gray-600 mb-5">操作成功</p>
            <button id="messageCloseBtn" class="bg-primary text-white px-6 py-2 rounded-md hover:bg-emerald-800 transition-colors">確定</button>
        </div>
    </div>

    <script type="module">
        // ==========================================
        // Firebase 預留區塊 (依照指示設定框架，但目前以記憶體/LocalStorage展示為主)
        // 後續掛載時，取消註解並填入實際 config
        // ==========================================
        /*
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 從環境變數或後端取得
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'bulaosong-zhongqing';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Your config here
        };
        
        let db, auth;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch(e) {
            console.log("Firebase not initialized yet. Using local data.");
        }
        */

        // ==========================================
        // 資料模型與預設資料
        // ==========================================
        
        // 將 rowsConfig 移至全域變數，使其可被動態編輯
        let rowsConfig = [
            { id: 'joinDate', label: '入職日', type: 'info', locked: true },
            { id: 'tenure', label: '年資', type: 'info', locked: true },
            { id: 'level', label: '職級', type: 'info', locked: true },
            { id: 'cat_skill', label: '工作技能', type: 'category' },
            { id: 'aDown', label: 'A下', type: 'rating' },
            { id: 'aUp', label: 'A上', type: 'rating' },
            { id: 'bZone', label: 'B區', type: 'rating' },
            { id: 'assist', label: '輔櫃', type: 'rating' },
            { id: 'cat_other', label: '其他項目', type: 'category' },
            { id: 'drawCard', label: '拉牌', type: 'rating' },
            { id: 'clean', label: '清潔', type: 'rating' },
            { id: 'supplies', label: '備品', type: 'rating' },
            { id: 'cat_soft', label: '軟實力', type: 'category' },
            { id: 'member', label: '會員', type: 'rating' },
            { id: 'review', label: '評論', type: 'rating' },
            { id: 'sales', label: '銷售', type: 'rating' },
            { id: 'attitude', label: '服務態度', type: 'rating' },
            { id: 'cooperation', label: '配合度', type: 'rating' },
            { id: 'attendance', label: '出勤', type: 'rating' },
            { id: 'appearance', label: '儀態', type: 'rating' },
            { id: 'actions', label: '資料操作', type: 'actions', locked: true }
        ];

        // 從 rowsConfig 動態取得目前所有評分項目的 ID 清單
        function getSkillCategories() {
            return rowsConfig.filter(row => row.type === 'rating').map(row => row.id);
        }

        // 模擬初始資料 (由圖片預設匯入的人員名單與職級測試資料)
        let employees = [

        // 計算年資 (例如: 1年2個月)
        function calculateTenure(joinDateStr) {
            if (!joinDateStr) return '-';
            const joinDate = new Date(joinDateStr);
            // 系統要求設定當前時間為 2026-09-29
            const today = new Date('2026-09-29T10:06:48+08:00'); 
            
            if (joinDate > today) return '尚未入職';

            let years = today.getFullYear() - joinDate.getFullYear();
            let months = today.getMonth() - joinDate.getMonth();
            
            if (months < 0) {
                years--;
                months += 12;
            }
            
            if (years === 0 && months === 0) return '未滿1個月';
            
            let result = '';
            if (years > 0) result += `${years}年`;
            if (months > 0) result += `${months}個月`;
            return result;
        }

        // 生成 1-5 顆星 HTML (支援半星)
        function generateStarRatingHTML(empId, category, rating) {
            const adminClass = typeof isAdmin !== 'undefined' && isAdmin ? 'is-admin' : '';
            let html = `<div class="star-rating ${adminClass}" data-emp="${empId}" data-cat="${category}" onmousemove="handleStarHover(event)" onmouseleave="handleStarLeave(event)" onclick="handleStarClick(event)">`;
            
            for (let i = 1; i <= 5; i++) {
                // 決定星星填滿程度的寬度 class
                let fillWidthClass = 'w-0';
                if (rating >= i) {
                    fillWidthClass = 'w-100'; // 全星
                } else if (rating === i - 0.5) {
                    fillWidthClass = 'w-50';  // 半星
                }
                
                html += `
                <div class="star-wrapper" data-val="${i}">
                    <i class="fa-solid fa-star text-gray-300"></i>
                    <i class="fa-solid fa-star fill-star ${fillWidthClass}"></i>
                </div>`;
            }
            html += `</div>`;
            // 加入數字顯示，方便閱讀
            html += `<div class="text-[10px] text-gray-500 mt-0.5 rating-text">${rating.toFixed(1)}</div>`;
            return html;
        }

        // 處理星星滑鼠懸浮 (Global 函式，供行內事件呼叫)
        window.handleStarHover = function(e) {
            if (typeof isAdmin !== 'undefined' && !isAdmin) return; // 權限阻擋
            const container = e.currentTarget;
            const wrapper = e.target.closest('.star-wrapper');
            if (!wrapper) return;
            
            const rect = wrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const isHalf = x < rect.width / 2;
            const hoverValue = parseInt(wrapper.getAttribute('data-val'));
            
            // 預覽顯示
            updateStarVisuals(container, isHalf ? hoverValue - 0.5 : hoverValue);
        };

        window.handleStarLeave = function(e) {
            if (typeof isAdmin !== 'undefined' && !isAdmin) return; // 權限阻擋
            const container = e.currentTarget;
            const empId = container.getAttribute('data-emp');
            const cat = container.getAttribute('data-cat');
            
            // 恢復原本的評分
            const emp = employees.find(e => e.id === empId);
            const currentRating = emp.ratings[cat] || 0;
            updateStarVisuals(container, currentRating);
        };

        window.handleStarClick = function(e) {
            if (typeof isAdmin !== 'undefined' && !isAdmin) return; // 權限阻擋
            const container = e.currentTarget;
            const wrapper = e.target.closest('.star-wrapper');
            if (!wrapper) return;
            
            const rect = wrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const isHalf = x < rect.width / 2;
            const clickValue = parseInt(wrapper.getAttribute('data-val'));
            const finalRating = isHalf ? clickValue - 0.5 : clickValue;
            
            const empId = container.getAttribute('data-emp');
            const cat = container.getAttribute('data-cat');
            
            // 更新資料模型
            const emp = employees.find(e => e.id === empId);
            if(emp) {
                emp.ratings[cat] = finalRating;
                // 更新 UI 上的數字
                container.nextElementSibling.innerText = finalRating.toFixed(1);
                updateStarVisuals(container, finalRating);
                
                // 標記需要儲存
                document.getElementById('saveDataBtn').classList.add('bg-red-500', 'text-white');
                document.getElementById('saveDataBtn').classList.remove('bg-white', 'text-primary');
                document.getElementById('saveDataBtn').innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> 有未儲存變更';
            }
        };

        function updateStarVisuals(container, rating) {
            const wrappers = container.querySelectorAll('.star-wrapper');
            wrappers.forEach((wrapper, index) => {
                const starVal = index + 1;
                const fillStar = wrapper.querySelector('.fill-star');
                
                // 重置
                fillStar.classList.remove('w-0', 'w-50', 'w-100');
                
                if (rating >= starVal) {
                    fillStar.classList.add('w-100');
                } else if (rating === starVal - 0.5) {
                    fillStar.classList.add('w-50');
                } else {
                    fillStar.classList.add('w-0');
                }
            });
        }

        // 渲染員工矩陣表格 (轉置表格: 列為技能，欄為員工)
        function renderEmployeeTable(filterText = '') {
            const table = document.getElementById('employeeTable');
            const emptyState = document.getElementById('emptyState');
            table.innerHTML = '';
            
            const lowerFilter = filterText.toLowerCase();
            const filteredEmp = employees.filter(emp => 
                emp.name.toLowerCase().includes(lowerFilter) || 
                emp.code.toLowerCase().includes(lowerFilter)
            );

            // 實作自動排序邏輯：職級 > 星級總數
            const levelRank = { '店長': 1, '主任': 2, '領航員': 3, '櫃台': 4 };
            filteredEmp.sort((a, b) => {
                const rankA = levelRank[a.level] || 99;
                const rankB = levelRank[b.level] || 99;
                
                // 第一條件：先排職級
                if (rankA !== rankB) {
                    return rankA - rankB; 
                }
                
                // 第二條件：職級相同，則依照所有星級加總分數降序排列 (高分在左邊)
                const calcTotalStars = (emp) => Object.values(emp.ratings).reduce((sum, val) => sum + (Number(val) || 0), 0);
                return calcTotalStars(b) - calcTotalStars(a);
            });

            if (filteredEmp.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                table.classList.add('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
            table.classList.remove('hidden');

            // 1. 建立固定的頂部表頭 (包含左上角交界處與員工照片基本資料)
            let thead = `<thead><tr>`;
            // 左上角固定區塊 (z-index 最高)
            thead += `<th class="sticky top-0 left-0 bg-primary text-white z-30 w-24 border-b border-emerald-900 p-2 align-bottom shadow-[2px_2px_5px_rgba(0,0,0,0.2)] tracking-widest text-center text-xs">
                        項目 \\ 員工
                      </th>`;
            
            filteredEmp.forEach(emp => {
                const photoSrc = emp.photo || `https://placehold.co/60x60/2c4a3b/ffffff?text=${emp.name.charAt(0)}`;
                // 頂部列，向下滑動時固定 (z-20)。縮小照片與字體以達成緊湊顯示
                thead += `
                    <th class="sticky top-0 bg-white border-b border-gray-300 z-20 min-w-[100px] p-2 text-center shadow-[0_2px_5px_rgba(0,0,0,0.05)] border-r border-gray-200">
                        <img src="${photoSrc}" alt="${emp.name}" class="w-10 h-10 rounded-full mx-auto mb-1 border-2 border-gray-200 object-cover shadow-sm" onerror="this.src='https://placehold.co/60x60/cccccc/ffffff?text=X'">
                        <div class="font-bold text-gray-800 text-sm leading-tight">${emp.name}</div>
                        <div class="text-[10px] text-gray-500 font-normal">${emp.code}</div>
                    </th>
                `;
            });
            thead += `</tr></thead>`;

            // 2. 渲染每一列 (根據動態的 rowsConfig)
            let tbody = `<tbody>`;
            
            rowsConfig.forEach((row, rowIndex) => {
                const bgClass = rowIndex % 2 === 0 ? 'bg-white' : 'bg-gray-50/50';

                // 處理大分類標籤列
                if (row.type === 'category') {
                    tbody += `<tr>`;
                    tbody += `<th class="sticky left-0 bg-emerald-800 text-white z-10 w-24 px-2 py-1 text-center font-bold border-r border-gray-300 shadow-[2px_0_4px_rgba(0,0,0,0.1)] text-xs tracking-widest">${row.label}</th>`;
                    tbody += `<td colspan="${filteredEmp.length}" class="bg-emerald-50/50 border-r border-gray-100 p-0 shadow-inner"></td>`;
                    tbody += `</tr>`;
                    return;
                }

                tbody += `<tr class="${bgClass} hover:bg-emerald-50 transition-colors">`;
                // 左側固定欄位 (z-10)
                tbody += `<th class="sticky left-0 bg-primary text-emerald-50 z-10 w-24 px-2 py-1.5 text-center font-medium border-r border-emerald-900 shadow-[2px_0_4px_rgba(0,0,0,0.1)] text-xs">${row.label}</th>`;

                // 員工資料填入對應欄位
                filteredEmp.forEach(emp => {
                    tbody += `<td class="px-2 py-1.5 border-r border-gray-200 text-center">`;
                    
                    if (row.type === 'info') {
                        if (row.id === 'tenure') {
                            tbody += `<span class="text-emerald-700 font-bold text-[11px]">${calculateTenure(emp.joinDate)}</span>`;
                        } else if (row.id === 'level') {
                            tbody += `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-200 whitespace-nowrap">${emp.level}</span>`;
                        } else {
                            tbody += `<span class="text-gray-700 font-medium text-[11px]">${emp[row.id]}</span>`;
                        }
                    } else if (row.type === 'rating') {
                        // 確保該員工有此評分項目的初始值
                        if (emp.ratings[row.id] === undefined) emp.ratings[row.id] = 0;
                        tbody += generateStarRatingHTML(emp.id, row.id, emp.ratings[row.id]);
                    } else if (row.type === 'actions') {
                        // 判斷是否為管理員
                        if (typeof isAdmin !== 'undefined' && isAdmin) {
                            tbody += `
                                <div class="flex justify-center gap-1">
                                    <button onclick="editEmployee('${emp.id}')" class="text-blue-600 hover:text-blue-800 hover:bg-blue-100 px-2 py-1 bg-blue-50 rounded transition-colors text-[10px] font-medium border border-blue-200">

                                    </button>
                                </div>
                            `;
                        } else {
                            tbody += `<span class="text-[10px] text-gray-400"><i class="fa-solid fa-lock"></i> 唯讀</span>`;
                        }
                    }
                    tbody += `</td>`;
                });
                tbody += `</tr>`;
            });
            tbody += `</tbody>`;

            table.innerHTML = thead + tbody;
            
            // 更新客訴選單中的員工列表
            updateComplaintEmployeeSelect();
        }

            document.getElementById('editEmpId').value = emp.id;
            document.getElementById('empCode').value = emp.code;
            document.getElementById('empName').value = emp.name;
            document.getElementById('empJoinDate').value = emp.joinDate;
            document.getElementById('empLevel').value = emp.level;
            document.getElementById('empPhotoUrl').value = emp.photo || '';
            
            document.getElementById('modalTitle').innerText = '編輯員工資料';
            modal.classList.add('active');
        };

        window.deleteEmployee = function(id) {
            // 這裡本來應該用 confirm，但規定禁止使用 alert/confirm，
            // 為了簡化，直接刪除並提示。正式版可做一個客製化確認 Modal。
            employees = employees.filter(e => e.id !== id);
            // 移除相關客訴綁定
            complaints.forEach(c => { if(c.empId === id) c.empId = ''; });
            
            renderEmployeeTable();
            renderComplaints();
            showMessage('已刪除', '員工資料已移除', 'warning');
        };

        // --- 動態欄位管理系統 (權限控管 8888) ---
        let isAdmin = false; // 全局唯讀狀態變數

        const authModal = document.getElementById('authModal');
        const manageColumnsModal = document.getElementById('manageColumnsModal');
        const adminPasswordInput = document.getElementById('adminPassword');
        
        // 進入管理員登入畫面
        document.getElementById('loginBtn').addEventListener('click', () => {
            adminPasswordInput.value = '';
            authModal.classList.add('active');
            adminPasswordInput.focus();
        });

        // 登出管理員
        document.getElementById('logoutBtn').addEventListener('click', () => {
            isAdmin = false;
            updateUIState();
            showMessage('已登出', '返回唯讀模式');
        });

        // 打開欄位管理 (需先登入)
        document.getElementById('manageColumnsBtn').addEventListener('click', () => {
            renderColumnsManageTable();
            manageColumnsModal.classList.add('active');
        });

        // 驗證密碼
        document.getElementById('verifyPasswordBtn').addEventListener('click', () => {
            if (adminPasswordInput.value === '8888') {
                isAdmin = true;
                authModal.classList.remove('active');
                updateUIState();
                showMessage('登入成功', '已開啟管理權限，現在可以編輯資料與欄位了');
            } else {
                showMessage('驗證失敗', '密碼錯誤，請重新輸入', 'error');
                adminPasswordInput.value = '';
            }
        });

        // 綁定 Enter 鍵觸發驗證
        adminPasswordInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') document.getElementById('verifyPasswordBtn').click();
        });

        // 統一更新介面狀態 (管理模式 / 唯讀模式)
        function updateUIState() {
            const guestToolbar = document.getElementById('guestToolbar');
            const adminToolbar = document.getElementById('adminToolbar');
            const complaintForm = document.getElementById('complaintForm');

            if (isAdmin) {
                // 顯示管理工具
                guestToolbar.classList.replace('flex', 'hidden');
                adminToolbar.classList.replace('hidden', 'flex');
                complaintForm.classList.remove('hidden');
            } else {
                // 顯示唯讀工具
                guestToolbar.classList.replace('hidden', 'flex');
                adminToolbar.classList.replace('flex', 'hidden');
                complaintForm.classList.add('hidden');
            }

            // 重新渲染表格以套用權限鎖 (更新星星與按鈕狀態)
            renderEmployeeTable();
            renderComplaints();
        }

        // 渲染管理介面中的欄位清單
        function renderColumnsManageTable() {
            const tbody = document.getElementById('columnsManageBody');
            tbody.innerHTML = '';
            
            rowsConfig.forEach((row, index) => {
                const isLocked = row.locked;
                const tr = document.createElement('tr');
                tr.className = `border-b border-gray-100 ${isLocked ? 'bg-gray-50' : 'hover:bg-emerald-50'}`;
                
                let typeBadge = '';
                if (row.type === 'info') typeBadge = '<span class="bg-gray-200 text-gray-700 px-2 py-0.5 rounded text-[10px]">基本資料</span>';
                else if (row.type === 'category') typeBadge = '<span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-[10px]">分類標題</span>';
                else if (row.type === 'rating') typeBadge = '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px]">評分項目</span>';
                else if (row.type === 'actions') typeBadge = '<span class="bg-gray-200 text-gray-700 px-2 py-0.5 rounded text-[10px]">操作列</span>';

                tr.innerHTML = `
                    <td class="px-4 py-2">${typeBadge}</td>
                    <td class="px-4 py-2">
                        ${isLocked ? 
                            `<span class="text-gray-500 font-medium">${row.label} <i class="fa-solid fa-lock text-[10px] ml-1"></i></span>` : 
                            `<input type="text" value="${row.label}" onchange="updateRowLabel(${index}, this.value)" class="border-b border-gray-300 focus:border-primary focus:outline-none bg-transparent w-full text-sm font-medium text-gray-800">`
                        }
                    </td>
                    <td class="px-4 py-2 text-center">
                        ${isLocked ? 
                            `<span class="text-xs text-gray-400">已鎖定</span>` : 
                            `<button onclick="deleteRow(${index})" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-1.5 rounded transition-colors" title="刪除項目"><i class="fa-solid fa-trash"></i></button>`
                        }
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 供 HTML inline event 呼叫的欄位管理操作
        window.updateRowLabel = function(index, newLabel) {
            if (newLabel.trim() === '') return;
            rowsConfig[index].label = newLabel.trim();
            renderEmployeeTable(); // 即時更新底層表格
        };

        window.deleteRow = function(index) {
            if (rowsConfig[index].locked) return;
            const deletedRow = rowsConfig.splice(index, 1)[0];
            
            // 若為評分項目，雖然不強制清除員工身上的資料(保留歷史)，但之後就不會渲染了
            renderColumnsManageTable();
            renderEmployeeTable();
        };

        window.addNewRow = function(type) {
            const label = prompt(`請輸入新${type === 'category' ? '分類標題' : '評分項目'}的名稱：`);
            if (!label || label.trim() === '') return;
            
            // 找到最後一個非 actions 的位置插入
            const actionsIndex = rowsConfig.findIndex(r => r.type === 'actions');
            const insertIndex = actionsIndex !== -1 ? actionsIndex : rowsConfig.length;
            
            const newId = (type === 'rating' ? 'rating_' : 'cat_') + Date.now();
            
            rowsConfig.splice(insertIndex, 0, {
                id: newId,
                label: label.trim(),
                type: type
            });
            
            // 為所有現有員工初始化該項目的分數為 0
            if (type === 'rating') {
                employees.forEach(emp => {
                    emp.ratings[newId] = 0;
                });
            }
            
            renderColumnsManageTable();
            renderEmployeeTable();
        };

        // 模擬儲存資料按鈕
        document.getElementById('saveDataBtn').addEventListener('click', (e) => {
            const btn = e.currentTarget;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 儲存中...';
            
            // 模擬非同步儲存
            setTimeout(() => {
                const now = new Date();
                document.getElementById('lastUpdated').innerText = now.toLocaleString('zh-TW');
                
                // 恢復按鈕狀態
                btn.classList.remove('bg-red-500', 'text-white');
                btn.classList.add('bg-white', 'text-primary');
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> 儲存至雲端';
                
                showMessage('儲存成功', '資料已同步至雲端', 'success');
            }, 800);
        });

        // 初始化
        window.onload = function() {
            // 設定當下時間預設值給客訴日期
            document.getElementById('complaintDate').valueAsDate = new Date('2026-09-29T10:06:48+08:00');
            
            // 系統啟動，預設套用唯讀模式並進行初次渲染
            updateUIState();
        };

    </script>
</body>
</html>
